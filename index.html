<!DOCTYPE html>
<html lang="ar" dir="rtl" style="background:#000">
<head>
<meta charset="UTF-8">
<title>خلص الوقت</title>
<style>
html,body{height:100%;margin:0;overflow:hidden}
.text{
  height:100vh;
  width:100vw;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#ff3333;
  font-size:8vw; /* يتكيف مع عرض الشاشة */
  font-family:tahoma,arial;
  font-weight:bold;
  text-align:center;
  line-height:1.5;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0.2}}
</style>
</head>
<body>
<div class="text">لا حول ولا قوة الا بالله<br>...خلص الوقت</div>
</body>
</html>
