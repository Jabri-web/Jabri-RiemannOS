<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>P8 - Jabri RiemannOS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#e0e0e0;font-family:'Cairo',Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .wrap{max-width:600px;margin:auto;padding:30px 20px;width:100%;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
  
  /* الدائرة */
  .circle{width:90px;height:90px;border:3px solid #00ffc8;border-radius:50%;margin:0 auto;background:#1a1a24;box-shadow:0 0 20px rgba(0,255,200,0.2)}
  
  /* الهيدر */
  .header{background:#1a1a24;border:1px solid #00ffc8;border-radius:12px;padding:18px;text-align:center;font-size:22px;color:#00ffc8;font-weight:bold;letter-spacing:1px}
  
  /* ازرار Collab و Profile */
  .row{display:flex;gap:15px}
  .btn{flex:1;background:#1a1a24;border:1px solid #00ffc8;border-radius:12px;padding:22px 10px;text-align:center;color:#00ffc8;text-decoration:none;font-size:18px;font-weight:bold;transition:0.3s}
  .btn:hover{background:#222233;transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,255,200,0.15)}
  
  /* الكروت السفلية */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .card{background:#1a1a24;border:1px solid #00ffc8;border-radius:12px;padding:25px 12px;text-align:center;text-decoration:none;transition:0.3s}
  .card:hover{background:#222233;transform:translateY(-4px)}
  .card .ar{font-size:15px;color:#888;margin-bottom:8px}
  .card .en{font-size:17px;color:#00ffc8;font-weight:bold}
  
  /* الفوتر */
  .footer{background:#1a1a24;border:1px solid #00ffc8;border-radius:12px;padding:18px;text-align:center;font-size:18px;color:#00ffc8;font-weight:bold}
  
  @media(max-width:520px){
    .row,.grid{flex-direction:column;grid-template-columns:1fr}
    .circle{width:70px;height:70px}
  }
</style>
</head>
<body>
<div class="wrap">
  
  <div style="display:flex;flex-direction:column;gap:20px">
    <!-- الدائرة -->
    <div class="circle"></div>
    
    <!-- Header -->
    <div class="header">Header</div>
    
    <!-- Collab + Profile -->
    <div class="row">
      <a href="#" class="btn">Collab</a>
      <a href="#" class="btn">Profile</a>
    </div>
    
    <!-- Dbase + History -->
    <div class="grid">
      <a href="Dbase.html" class="card">
        <div class="ar">قواعد البيانات</div>
        <div class="en">Dbase.html</div>
      </a>
      
      <a href="History-pdf.html" class="card">
        <div class="ar">كتب التاريخ</div>
        <div class="en">History-pdf.html</div>
      </a>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="footer">Footer</div>
  
</div>
</body>
</html>
